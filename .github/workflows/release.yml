# Package each Pandia addon for Forever and attach zips to the GitHub Release.
# After CurseForge projects exist: set ## X-Curse-Project-ID in each .toc and
# add repo secret CF_API_TOKEN; remove -d from packager args to auto-upload.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - PandiaChat
          - PandiaNameplates
          - PandiaQuestLinks
          - PandiaQuestMarkers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package ${{ matrix.addon }}
        uses: BigWigsMods/packager@v2
        with:
          args: -d -g forever -t ${{ matrix.addon }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}
          path: ${{ matrix.addon }}/.release/*.zip
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
