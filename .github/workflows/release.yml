# Package each Pandia addon for Forever, upload to CurseForge, attach zips to GitHub Release.
# Requires repo secret CF_API_TOKEN and ## X-Curse-Project-ID in each .toc.
#
# Monorepo: BigWigs packager walks git-tracked paths and needs a TOC at the git
# root. Each matrix job copies one addon into a fresh git repo (with the release
# tag) and packages from there so the zip contains Addon/Addon.toc.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - PandiaChat
          - PandiaNameplates
          - PandiaQuestLinks
          - PandiaQuestMarkers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage ${{ matrix.addon }} as its own git root
        run: |
          set -euo pipefail
          ADDON="${{ matrix.addon }}"
          STAGE="${{ runner.temp }}/addon-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$ADDON"/. "$STAGE/"
          test -f "$STAGE/${ADDON}.toc"
          cd "$STAGE"
          git init
          git config user.email "release@pandia.local"
          git config user.name "Pandia Release"
          git add -A
          git commit -m "${{ github.ref_name }}"
          git tag "${{ github.ref_name }}"

      - name: Package ${{ matrix.addon }}
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: -g forever -t ${{ runner.temp }}/addon-root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}
          path: ${{ runner.temp }}/addon-root/.release/*.zip
          if-no-files-found: error
          include-hidden-files: true

  github-release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
